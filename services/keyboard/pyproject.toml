[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmclone-keyboard"
version = "0.1.0"
description = "SwarmClone 键盘服务 - 快捷键监听模块"
requires-python = ">=3.9"
dependencies = [
    "redis>=5.0.0",
    "pydantic>=2.5.0",
    "loguru>=0.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
