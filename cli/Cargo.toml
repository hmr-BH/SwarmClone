[package]
name = "swarmclone-cli"
version = "0.1.0"
edition = "2021"
description = "SwarmClone CLI - 一键部署和管理工具"
authors = ["SwarmClone Team"]

[[bin]]
name = "swarmclone"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
which = "6.0"
sysinfo = "0.30"
dirs = "5.0"
