system:
  mode: development
  log_level: INFO

services:
  asr:
    enabled: true
    engine: aliyun
    model: fun-asr
    language: zh
    api_key: ${ALIYUN_API_KEY}
  tts:
    enabled: true
    engine: aliyun
    model: qwen3-tts-flash-realtime
    voice: Cherry
    sample_rate: 24000
    api_key: ${ALIYUN_API_KEY}
  vision:
    enabled: false
    device: 0
    fps: 30
  vrchat:
    enabled: true
    osc_address: 127.0.0.1
    osc_port: 9000
    auto_reconnect: true
    reconnect_interval: 5.0
  keyboard:
    enabled: true

messaging:
  redis:
    host: localhost
    port: 6379
    db: 0

web:
  host: 0.0.0.0
  port: 8080
