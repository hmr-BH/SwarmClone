syntax = "proto3";

package vtuber;

// 消息定义
message Empty {}

// 文本请求
message TextRequest {
  string session_id = 1;
  string text = 2;
  map<string, string> metadata = 3;
}

// 文本响应
message TextResponse {
  string session_id = 1;
  string text = 2;
  bool is_final = 3;
  map<string, string> metadata = 4;
}

// 音频数据
message AudioData {
  string session_id = 1;
  bytes data = 2;
  string format = 3;
  int32 sample_rate = 4;
}

// 音频响应
message AudioResponse {
  string session_id = 1;
  bytes data = 2;
  string format = 3;
  int32 sample_rate = 4;
}

// 控制命令
message ControlCommand {
  string command = 1;
  map<string, string> params = 2;
}

// 控制响应
message ControlResponse {
  bool success = 1;
  string message = 2;
  map<string, string> data = 3;
}

// 服务状态
message ServiceStatus {
  string name = 1;
  string status = 2;
  int64 timestamp = 3;
  string error = 4;
}

// LLM服务
service LLMService {
  // 单次对话
  rpc Chat(TextRequest) returns (TextResponse);
  // 流式对话
  rpc ChatStream(TextRequest) returns (stream TextResponse);
}

// TTS服务
service TTSService {
  // 文本转语音
  rpc Synthesize(TextRequest) returns (AudioResponse);
  // 流式合成
  rpc SynthesizeStream(TextRequest) returns (stream AudioResponse);
}

// ASR服务
service ASRService {
  // 语音识别
  rpc Recognize(stream AudioData) returns (TextResponse);
  // 流式识别
  rpc RecognizeStream(stream AudioData) returns (stream TextResponse);
}

// 虚拟主播服务
service VTuberService {
  // 获取服务状态
  rpc GetStatus(Empty) returns (ServiceStatus);
  // 执行控制命令
  rpc ExecuteCommand(ControlCommand) returns (ControlResponse);
  // 双向流式通讯
  rpc StreamChat(stream TextRequest) returns (stream TextResponse);
}
